## IDF Component Manager Manifest File
dependencies:
  # The locally patched copy in ../../components/esp32-camera (EXTRA_COMPONENT_DIRS
  # in ../CMakeLists.txt) takes precedence; the registry copy is not downloaded.
  # cam_record.c needs the patched cam_hal pause/resume (cam_stop / cam_start).
  espressif/esp32-camera: "*"
  ## Required IDF version
  idf:
    version: ">=4.1.0"
