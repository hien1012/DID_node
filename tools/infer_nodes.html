<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DID 節點總覽</title>
<style>
/* 與 infer_dashboard.html 同一套色彩；LAN 上沒有對外網路，不依賴 CDN。 */
:root {
  --bg: #eef1ef; --panel: #ffffff; --ink: #18211e; --muted: #5a6761; --line: #d6ddd9; --track: #e6ebe8;
  --drone: #c2410c; --helicopter: #7c3aed; --bird: #0369a1; --background: #6b7a73;
  --low: #b45309; --ok: #15803d; --bad: #b91c1c; --accent: #0f766e;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  --sans: "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101513; --panel: #181f1c; --ink: #e4ebe7; --muted: #97a59e; --line: #2a3430; --track: #252e2a;
    --drone: #fb923c; --helicopter: #a78bfa; --bird: #38bdf8; --background: #8a9a92;
    --low: #fbbf24; --ok: #4ade80; --bad: #f87171; --accent: #2dd4bf;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
h1 { font-size: 17px; margin: 0; font-weight: 600; }
main { display: grid; gap: 14px; padding: 14px 18px 40px; max-width: 1500px; margin: 0 auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-head .title { font-size: 15px; font-weight: 600; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pill { font: 12px var(--mono); padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.low { color: var(--low); } .pill.idle { color: var(--muted); }
.summary { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.summary .k { font-size: 12px; color: var(--muted); }
.summary .v { font: 18px var(--mono); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-family: var(--mono); }
tr.offline td { color: var(--muted); }
.label-dot::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); }
.warn { color: var(--low); } .bad { color: var(--bad); }
.meter { display: inline-block; width: 54px; height: 7px; background: var(--track); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
.meter i { display: block; height: 100%; background: var(--low); }
.empty { color: var(--muted); padding: 18px 4px; }
</style>
</head>
<body>
<header class="top">
  <h1>DID 節點總覽</h1>
  <a href="/dashboard">單一節點儀表板</a>
  <span id="link" class="pill idle">連線中…</span>
  <span id="clock" class="muted mono" style="margin-left:auto"></span>
</header>

<main>
  <section class="panel">
    <div class="summary" id="summary"></div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <span class="title">相機節點</span>
      <span class="muted" id="video-note"></span>
    </div>
    <div class="scroll"><table id="video-table"></table></div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <span class="title">麥克風節點</span>
      <span class="muted" id="audio-note"></span>
    </div>
    <div class="scroll"><table id="audio-table"></table></div>
  </section>
</main>

<script>
const NAMES = { background: "背景", drone: "無人機", helicopter: "直升機", bird: "鳥" };
/* 推論結果每幾秒就會送一次 (相機每幀、麥克風每 2 s)，超過這麼久沒收到就標「延遲」 */
const LIVE_MS = 15000;
const REFRESH_MS = 5000;

const $ = (id) => document.getElementById(id);
function nameOf(label) { return NAMES[label] || label || "—"; }
function colorOf(label) { return `var(--${label in NAMES ? label : "background"})`; }
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function pad(n) { return String(n).padStart(2, "0"); }
function timeText(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function agoText(ms, now) {
  if (!ms) return "—";
  const s = Math.max(0, Math.round((now - ms) / 1000));
  if (s < 90) return `${s} 秒前`;
  if (s < 5400) return `${Math.round(s / 60)} 分前`;
  if (s < 172800) return `${Math.round(s / 3600)} 小時前`;
  return `${Math.round(s / 86400)} 天前`;
}
function uptimeText(s) {
  if (s == null) return "—";
  if (s < 3600) return `${Math.floor(s / 60)} 分`;
  if (s < 172800) return `${(s / 3600).toFixed(1)} 時`;
  return `${(s / 86400).toFixed(1)} 天`;
}
function num(v) { return v == null ? "—" : String(v); }

/* 最後收到推論結果或 heartbeat 的時間，決定即時 / 延遲 / 離線 */
function linkState(node, now, offlineMs) {
  const seen = Math.max(node.updated_ms || 0, node.heartbeat_ms || 0);
  if (now - seen <= LIVE_MS) return { cls: "ok", text: "即時", seen };
  if (now - seen <= offlineMs) return { cls: "low", text: "延遲", seen };
  return { cls: "bad", text: "離線", seen };
}

function labelsText(labels) {
  const entries = Object.entries(labels).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '<span class="muted">—</span>';
  return entries.map(([label, n]) =>
    `<span class="label-dot" style="--c:${colorOf(label)}">${escapeHtml(nameOf(label))} <span class="mono">${n}</span></span>`
  ).join(" ");
}

function lastText(last, now) {
  if (!last) return '<span class="muted">—</span>';
  const conf = last.conf != null ? (last.conf * 100).toFixed(0) + "%" : "—";
  return `<span class="label-dot" style="--c:${colorOf(last.label)}">${escapeHtml(nameOf(last.label))}</span>
    <span class="mono ${last.low ? "warn" : ""}">${conf}</span>
    <span class="muted">${agoText(last.ts_ms, now)}</span>`;
}

function pendingText(node) {
  const target = node.upload_after || 20;
  const pct = Math.min(100, (node.pending / target) * 100);
  return `<span class="meter"><i style="width:${pct.toFixed(0)}%"></i></span><span class="mono">${node.pending} / ${target}</span>`;
}

function pipelineText(node) {
  const p = node.pipeline || {};
  if (node.role === "video") {
    const dropped = p.dropped || 0;
    const expired = p.rois_expired || 0;
    return `<span class="mono ${dropped ? "warn" : ""}">丟幀 ${num(p.dropped)}</span> ·
      <span class="mono ${expired ? "warn" : ""}">過期 ${num(p.rois_expired)}</span> ·
      <span class="mono ${p.gaps ? "warn" : ""}">斷層 ${num(p.gaps)}</span>`;
  }
  return `<span class="mono ${p.dropped ? "warn" : ""}">丟視窗 ${num(p.dropped)}</span> ·
    <span class="mono ${p.overflows ? "warn" : ""}">overflow ${num(p.overflows)}</span>`;
}

function renderTable(el, nodes, now, offlineMs) {
  if (!nodes.length) {
    el.innerHTML = '<tr><td class="empty">沒有節點。節點開始回傳推論結果後會出現在這裡。</td></tr>';
    return;
  }
  const head = `<tr><th>狀態</th><th>節點</th><th class="num">最近 1 小時</th><th class="num">低信賴</th>
    <th>類別分布</th><th>最新結果</th><th>待上傳樣本</th><th class="num">已收樣本</th><th>管線</th>
    <th class="num">RSSI</th><th class="num">RAM 最低</th><th class="num">SD 剩餘</th><th class="num">開機</th></tr>`;
  const rows = nodes.map((node) => {
    const link = linkState(node, now, offlineMs);
    const w = node.window || { total: 0, low: 0, labels: {} };
    const lowPct = w.total ? (w.low * 100 / w.total).toFixed(0) + "%" : "—";
    const heapWarn = node.heap_min_kb != null && node.heap_min_kb < 16 ? "warn" : "";
    const rssiWarn = node.rssi != null && node.rssi < -75 ? "warn" : "";
    return `<tr class="${link.cls === "bad" ? "offline" : ""}">
      <td><span class="pill ${link.cls}" title="最後收到 ${timeText(link.seen)}">${link.text}</span>
        <span class="muted">${link.cls === "ok" ? "" : agoText(link.seen, now)}</span></td>
      <td><a class="mono" href="/dashboard?device=${encodeURIComponent(node.device_id)}">${escapeHtml(node.device_id)}</a>
        ${node.state && node.state !== "running" ? `<span class="muted">${escapeHtml(node.state)}</span>` : ""}</td>
      <td class="num">${w.total}</td>
      <td class="num ${w.low ? "warn" : ""}">${w.low} <span class="muted">(${lowPct})</span></td>
      <td>${labelsText(w.labels)}</td>
      <td>${lastText(node.last, now)}</td>
      <td>${pendingText(node)}</td>
      <td class="num" title="最後收到 ${timeText(node.samples_last_ms)}">${node.samples_received}</td>
      <td>${pipelineText(node)}</td>
      <td class="num ${rssiWarn}">${num(node.rssi)}</td>
      <td class="num ${heapWarn}">${node.heap_min_kb != null ? node.heap_min_kb + " KB" : "—"}</td>
      <td class="num">${node.sd_free_mb != null ? node.sd_free_mb + " MB" : "—"}</td>
      <td class="num" title="${escapeHtml(node.reset_reason || "")}">${uptimeText(node.uptime_s)}</td>
    </tr>`;
  }).join("");
  el.innerHTML = head + rows;
}

function renderSummary(data) {
  const offlineMs = data.offline_after_s * 1000;
  const parts = ["video", "audio"].map((role) => {
    const nodes = data.nodes.filter((n) => n.role === role);
    const live = nodes.filter((n) => linkState(n, data.now_ms, offlineMs).cls === "ok").length;
    const low = nodes.reduce((sum, n) => sum + ((n.window || {}).low || 0), 0);
    const total = nodes.reduce((sum, n) => sum + ((n.window || {}).total || 0), 0);
    const name = role === "video" ? "相機" : "麥克風";
    return `<div><div class="k">${name}節點 即時 / 全部</div><div class="v">${live} / ${nodes.length}</div></div>
      <div><div class="k">${name} 最近 1 小時推論 (低信賴)</div><div class="v">${total} <span class="muted">(${low})</span></div></div>`;
  });
  $("summary").innerHTML = parts.join("");
}

async function refresh() {
  try {
    const res = await fetch("/api/infer/nodes");
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    const offlineMs = data.offline_after_s * 1000;
    renderSummary(data);
    renderTable($("video-table"), data.nodes.filter((n) => n.role === "video"), data.now_ms, offlineMs);
    renderTable($("audio-table"), data.nodes.filter((n) => n.role === "audio"), data.now_ms, offlineMs);
    $("video-note").textContent = "數量 = ROI 的 CNN 次數；管線 = 開機以來累計";
    $("audio-note").textContent = "數量 = 2 s 視窗數；管線 = 開機以來累計";
    $("link").textContent = "已更新";
    $("link").className = "pill ok";
    $("clock").textContent = timeText(data.now_ms);
  } catch (err) {
    $("link").textContent = "連不到 server";
    $("link").className = "pill bad";
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
